<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff2d5"><title>Presentación interactiva</title><link rel="stylesheet" href="assets/slides.css"><link rel="stylesheet" href="assets/editor.css" data-editor-asset></head>
<body><div id="app" class="app">

<div id="deck"><main id="stage" tabindex="-1" aria-label="Diapositiva actual"></main></div>
<nav id="nav"><div class="pbar"><span id="progressBar"></span></div><button class="nb" id="prevBtn">←</button><span class="cnt" id="counter"></span><button class="nb" id="nextBtn">→</button><span class="ttl"><b id="brand"></b> · <span id="chapter"></span></span><span id="completion"></span><div id="presentationLogos" hidden></div><button class="nb editor-control" id="editorBtn">✎ Editar</button><button class="nb editor-control" id="manageBtn">Gestionar</button><button class="nb" id="indexBtn">Índice <kbd>O</kbd></button><button class="nb" id="notesBtn">Notas <kbd>N</kbd></button><button class="nb" id="fullscreenBtn">⛶</button></nav>
<div id="indexPanel" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="indexTitle"><div class="oh dialog-heading"><h2 id="indexTitle">Índice</h2><button data-close="indexPanel">Cerrar ×</button></div><nav id="indexList" class="og" aria-label="Lista de diapositivas"></nav></section></div>
<div id="notesPanel" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="notesTitle"><div class="oh dialog-heading"><h2 id="notesTitle">Notas del ponente</h2><button data-close="notesPanel">Cerrar ×</button></div><div id="notesBody" class="notes-body"></div></section></div>
<div id="timer" class="timer" hidden><span id="timerDisplay">00:00</span><button id="timerToggle">Iniciar</button><button id="timerPlus" aria-label="Añadir un minuto">+1</button><button id="timerClose" aria-label="Cerrar temporizador">×</button></div>
<aside id="editorPanel" class="editor-panel editor-control" hidden aria-label="Editor de presentación">
  <div class="editor-header"><strong>Gestión de la presentación</strong><button id="editorClose" aria-label="Cerrar editor">×</button></div>
  
  <details open><summary>Logotipos (opcional, máximo 3)</summary><p class="editor-help">Sube PNG, JPEG, WebP o GIF. Las imágenes se guardan en el borrador y se incrustan en el HTML definitivo como Base64. Si no hay logos, no se reserva espacio.</p><label for="logoUpload">Añadir logotipos</label><input id="logoUpload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><div id="logoEditorList" class="logo-editor-list"></div></details>
  <label for="slidePicker">Diapositiva</label><select id="slidePicker"></select>
  <label class="editor-checkbox"><input id="slideEnabled" type="checkbox" checked> Incluir esta diapositiva en la versión definitiva</label>
  <details><summary>Configuración avanzada (ejercicio)</summary><label for="exerciseJson">Ejercicio en JSON</label><textarea id="exerciseJson" rows="7" spellcheck="false"></textarea><button id="exerciseApply">Aplicar ejercicio</button></details>
  <p id="editorMessage" role="status" aria-live="polite"></p>
  <div class="editor-actions"><button id="saveDraftBtn">Descargar borrador JSON</button><button id="loadDraftBtn">Importar JSON…</button><input id="loadDraftFile" type="file" accept=".json,application/json" hidden><button id="resetDraftBtn">Restaurar contenido original</button><button class="primary" id="publishBtn">Generar HTML definitivo</button></div>
 </aside>
 <div id="status" class="sr-only" role="status" aria-live="polite"></div>
</div><script src="assets/exercises.js" defer></script><script src="assets/editor.js" defer data-editor-asset></script><script src="assets/slides.js" defer></script></body></html>
